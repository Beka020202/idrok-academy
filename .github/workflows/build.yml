# GitHub ilovani o‘zi tekshiradi va quradi / GitHub сам проверяет и собирает приложение.
# Natija: Actions → oxirgi ishga tushirish → Artifacts → kodla-android (APK).
# Результат: Actions → последний запуск → Artifacts → kodla-android (APK).
# Loglar "ci-logs-android" / "ci-logs-ios" tarmoqlariga ham saqlanadi.
# Логи также сохраняются в ветки "ci-logs-android" / "ci-logs-ios".

name: Build Kodla app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare logs
        run: mkdir -p "$GITHUB_WORKSPACE/ci-logs" && flutter --version 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/0-flutter-version.txt"

      - name: Android/iOS papkalarini yaratish / создать папки платформ
        run: set -o pipefail; python3 tool/setup_platforms.py 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/1-setup.txt"

      - name: Kodni tekshirish / проверка кода
        run: set -o pipefail; flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/2-analyze.txt"

      - name: Testlar / тесты
        run: set -o pipefail; flutter test 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/3-test.txt"

      - name: Ekran rasmlari / скриншоты
        continue-on-error: true
        run: set -o pipefail; SCREENSHOTS_DIR="$GITHUB_WORKSPACE/ci-logs/shots" flutter test test/screenshot_test.dart 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/5-shots.txt"

      - name: APK yig‘ish / сборка APK
        run: set -o pipefail; flutter build apk --release 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/4-build-apk.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: kodla-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

      # To‘g‘ridan-to‘g‘ri yuklab olish havolasi (GitHub akkauntisiz):
      # Прямая ссылка для скачивания (без аккаунта GitHub):
      # https://github.com/<repo>/releases/latest/download/Idrok-Academy.apk
      - name: APK → Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Idrok-Academy.apk
          gh release delete latest --yes --cleanup-tag -R "${{ github.repository }}" || true
          gh release create latest Idrok-Academy.apk -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Idrok Academy (Android)" --notes "Build ${{ github.run_number }} · ${{ github.sha }}" --latest

      - name: Save logs
        if: always()
        working-directory: ${{ github.workspace }}/ci-logs
        run: |
          echo "run ${{ github.run_id }} · ${{ job.status }}" > STATUS.txt
          git init -q && git checkout -q -b logs
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "android logs ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:ci-logs-android


  # ---------------------------------------------------------------- brauzer versiyasi / веб-версия
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Web papkasini yaratish / создать папку web
        run: |
          flutter create --platforms=web --project-name kodla . >/dev/null
          sed -i 's#<title>.*</title>#<title>Idrok Academy</title>#' web/index.html
          sed -i 's#content="A new Flutter project."#content="Idrok Academy — dasturlashni o‘yin orqali o‘rganing"#' web/index.html
          python3 - <<'PY'
          import json
          m = json.load(open('web/manifest.json'))
          m.update(name='Idrok Academy', short_name='Idrok', background_color='#F5F7FB', theme_color='#0A6CFF',
                   description='Dasturlashni o‘yin orqali o‘rganing')
          json.dump(m, open('web/manifest.json', 'w'), ensure_ascii=False, indent=2)
          PY
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('assets/icon/icon.png').convert('RGBA')
          for path, n in [('web/favicon.png', 32), ('web/icons/Icon-192.png', 192), ('web/icons/Icon-512.png', 512),
                          ('web/icons/Icon-maskable-192.png', 192), ('web/icons/Icon-maskable-512.png', 512)]:
              im.resize((n, n), Image.LANCZOS).save(path)
          PY
      - name: Web yig‘ish / сборка web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/build/web

  # Faqat main: sayt + APK bitta joyda (github.io O‘zbekistonda ochiladi).
  # Только main: сайт + APK в одном месте (github.io открывается в Узбекистане).
  # https://<owner>.github.io/<repo>/  ·  .../Idrok-Academy.apk
  web-deploy:
    if: github.ref == 'refs/heads/main'
    needs: [web, android]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: kodla-android
          path: apk
      - run: cp apk/app-release.apk site/Idrok-Academy.apk && ls -la site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy

  ios:
    # iPhone uchun kod kompilyatsiya bo‘lishini tekshiradi (imzosiz).
    # Проверяет, что код собирается для iPhone (без подписи).
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare logs
        run: mkdir -p "$GITHUB_WORKSPACE/ci-logs"

      - name: Platforms
        run: set -o pipefail; python3 tool/setup_platforms.py 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/1-setup.txt"

      - name: Build iOS (no signing)
        run: set -o pipefail; flutter build ios --release --no-codesign 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/2-build-ios.txt"

      - name: Save logs
        if: always()
        working-directory: ${{ github.workspace }}/ci-logs
        run: |
          echo "run ${{ github.run_id }} · ${{ job.status }}" > STATUS.txt
          git init -q && git checkout -q -b logs
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "ios logs ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:ci-logs-ios
