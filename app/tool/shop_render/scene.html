<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const SIZE = 1024;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const BLUE = 0x0A6CFF, NAVY = 0x0A1226, SKY = 0x3FA9FF;
const loader = new THREE.TextureLoader();
const tex = {};
async function load(name) {
  const t = await loader.loadAsync(name);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  tex[name] = t;
  return t;
}
const imgs = {};
async function img(name) {
  return new Promise(r => { const i = new Image(); i.onload = () => { imgs[name] = i; r(i); }; i.src = name; });
}

function decalMat(t, opts = {}) {
  return new THREE.MeshPhysicalMaterial({
    map: t, transparent: true, roughness: opts.roughness ?? 0.4, metalness: 0,
    clearcoat: opts.clearcoat ?? 0, polygonOffset: true, polygonOffsetFactor: -4, depthWrite: false,
  });
}

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function screenTex(w, h) {
  return canvasTex(w, h, (g, W, H) => {
    const gr = g.createLinearGradient(0, 0, W * 0.4, H);
    gr.addColorStop(0, '#2EA6FF'); gr.addColorStop(1, '#0047D6');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    const rg = g.createRadialGradient(W * 0.8, H * 0.1, 10, W * 0.8, H * 0.1, W * 0.9);
    rg.addColorStop(0, 'rgba(191,240,255,0.45)'); rg.addColorStop(1, 'rgba(191,240,255,0)');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
    const L = imgs['logo_white.png'];
    const lw = Math.min(W, H) * 0.5, lh = lw * L.height / L.width;
    g.drawImage(L, (W - lw) / 2, (H - lh) / 2 - H * 0.03, lw, lh);
  });
}

function makeScene() {
  const scene = new THREE.Scene();
  scene.environment = envTex;
  const key = new THREE.DirectionalLight(0xffffff, 1.6);
  key.position.set(-3, 6, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -4; key.shadow.camera.right = 4; key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
  key.shadow.radius = 8; key.shadow.bias = -0.0005;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xbfe0ff, 0.8);
  rim.position.set(4, 3, -4);
  scene.add(rim);
  scene.add(new THREE.AmbientLight(0xffffff, 0.15));
  return scene;
}

function ground(scene, y, opacity = 0.22) {
  const g = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity }));
  g.rotation.x = -Math.PI / 2; g.position.y = y; g.receiveShadow = true;
  scene.add(g);
}

function shadowAll(o) { o.traverse(m => { if (m.isMesh && !m.material.transparent) { m.castShadow = true; m.receiveShadow = true; } }); }

function cam(pos, target, fov = 30) {
  const c = new THREE.PerspectiveCamera(fov, 1, 0.1, 100);
  c.position.set(...pos); c.lookAt(new THREE.Vector3(...target));
  return c;
}

    g.position.y = H / 2 * Math.cos(0.32) + 0.02;
    g.rotation.set(-0.32, -0.42, 0, 'YXZ');
    const stand = new THREE.Mesh(new RoundedBoxGeometry(1.2, 0.04, 0.5, 3, 0.015), alu); stand.position.set(0.05, 0.02, -0.2); stand.rotation.y = -0.42;
    s.add(stand);
    shadowAll(g); shadowAll(stand); s.add(g); ground(s, 0, 0.22);
    return [s, cam([0.3, 2.0, 5.6], [0, 1.08, 0], 32)];
  },

  laptop() {
    const s = makeScene(); const g = new THREE.Group();
    const alu = new THREE.MeshPhysicalMaterial({ color: 0xc9ced6, metalness: 0.9, roughness: 0.3 });
    const W = 2.7, D = 1.85, T = 0.09;
    const base = new THREE.Mesh(new RoundedBoxGeometry(W, T, D, 6, 0.04), alu); base.position.y = T / 2; g.add(base);
    const kb = canvasTex(1024, 420, (c, w, h) => {
      c.fillStyle = '#1b1e24'; c.fillRect(0, 0, w, h);
      const rows = 6, cols = 14, pad = 6;
      const kh = (h - pad * (rows + 1)) / rows, kw = (w - pad * (cols + 1)) / cols;
      for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
        if (r === 5 && k > 3 && k < 9) { if (k === 4) { c.fillStyle = '#2b3038'; c.fillRect(pad + k * (kw + pad), pad + r * (kh + pad), kw * 5 + pad * 4, kh); } continue; }
        c.fillStyle = '#2b3038'; c.fillRect(pad + k * (kw + pad), pad + r * (kh + pad), kw, kh);
      }
    });
    const keys = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.42, 0.95), new THREE.MeshPhysicalMaterial({ map: kb, roughness: 0.6 }));
    keys.rotation.x = -Math.PI / 2; keys.position.set(0, T + 0.001, -0.3); g.add(keys);
    const pad = new THREE.Mesh(new RoundedBoxGeometry(0.95, 0.004, 0.55, 2, 0.002), new THREE.MeshPhysicalMaterial({ color: 0xb4bac3, metalness: 0.8, roughness: 0.25 }));
    pad.position.set(0, T, 0.55); g.add(pad);
    const lid = new THREE.Group(); lid.position.set(0, T, -D / 2 + 0.02);
    const lidBody = new THREE.Mesh(new RoundedBoxGeometry(W, D, 0.05, 6, 0.024), alu); lidBody.position.set(0, D / 2, -0.025); lid.add(lidBody);
    const bez = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.04, D - 0.04), new THREE.MeshPhysicalMaterial({ color: 0x07080a, roughness: 0.05, clearcoat: 1 }));
    bez.position.set(0, D / 2, 0.0015); lid.add(bez);
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.2, D - 0.24), new THREE.MeshBasicMaterial({ map: screenTex(1280, 840), toneMapped: false }));
    scr.position.set(0, D / 2 + 0.01, 0.003); lid.add(scr);
    lid.rotation.x = -0.32;
    g.add(lid);
    g.rotation.y = -0.38;
    shadowAll(g); s.add(g); ground(s, 0, 0.24);
    return [s, cam([0.3, 3.0, 7.0], [0.05, 0.7, 0], 30)];
  },
};

window.ready = (async () => {
  for (const n of ['logo_white.png', 'logo_blue.png', 'mark_white.png', 'word_white.png']) { await load(n); await img(n); }

})();

window.renderItem = async (name) => {
